<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polanaluz · JS API example</title>
    <style>
      /* 背景色只放在 html 上：body 的背景会盖住 z-index:-1 的画布 */
      html { background: #f6f6f3; }
      body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei UI", sans-serif; }
      @media (prefers-color-scheme: dark) { html { background: #111214; color: #edeef0; } }
      /* 背景层：固定铺满、在内容下面、不挡点击 */
      #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
      main { max-width: 40em; margin: 20vh auto; padding: 0 16px; }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <main>
      <h1>Polanaluz · JS API example</h1>
      <p>Run <code>npm run build:lib</code> first to create dist/lib/polanaluz.min.js. The background follows the system dark / light setting.</p>
    </main>
    <script src="../dist/lib/polanaluz.min.js"></script>
    <script>
      // 全局命名空间是 window.Polanaluz（里面有 Polanaluz 类、STYLES、getStyle 等）
      const PL = window.Polanaluz;
      const style = PL.getStyle("stained-rays-rl");
      const mq = matchMedia("(prefers-color-scheme: dark)");
      const pick = () => (mq.matches ? style.dark : style.light);
      if (PL.Polanaluz.supported()) {
        const bg = new PL.Polanaluz(document.getElementById("bg"), pick());
        mq.addEventListener("change", () => bg.setConfig(pick()));
      }
    </script>
  </body>
</html>
